    - ${managed_role_id}
- id: ROLE-CANCEL-002
  title: 取消用户角色分配时参数为空
  request:
    auth: true
    payload:
      roleId: null
      userId: null
  expected:
    http_status: 200
    code: 500
    success: false
    msg_contains: 传入用户角色关联信息为空

