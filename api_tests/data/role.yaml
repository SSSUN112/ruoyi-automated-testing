role_assign_user_cases:
- id: ROLE-ASSIGN-001
  smoke: true
  title: 分配临时用户给临时角色
  request:
    auth: true
    params:
      roleId: ${managed_role_id}
      userIds: ${managed_user_id}
  expected:
    http_status: 200
    code: 200
    success: true
    msg_contains: 新增成功
  database:
    sql: |
      SELECT user_id, role_id
      FROM sys_user_role
      WHERE user_id = %s AND role_id = %s
      LIMIT 1
