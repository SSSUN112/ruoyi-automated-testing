      deptCheckStrictly: true
      remark: api automation duplicate role name
  expected:
    http_status: 200
    code: 500
    success: false
    msg_contains: 角色名称已存在
- id: ROLE-UPDATE-004
  title: 编辑角色时权限字符为空
  request:
