role_list_cases:
- id: ROLE-LIST-001
  smoke: true
  title: 按权限字符查询角色列表
  request:
    auth: true
    params:
      pageNum: 1
      pageSize: 10
      roleKey: common
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - rows
    - total
  page_assert:
    min_rows: 1
    min_total: 1
  contains_assert:
    rows_field: rows
    field: roleKey
    value: common
- id: ROLE-LIST-002
  title: 未登录获取角色列表
  request:
    auth: false
    params:
      pageNum: 1
      pageSize: 10
  expected:
    http_status: 200
    code: 401
    success: false
    msg_contains: 未登录
- id: ROLE-LIST-003
  title: 按不存在权限字符查询角色列表
  request:
    auth: true
    params:
      pageNum: 1
      pageSize: 10
      roleKey: not_exists_${unique}
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - rows
    - total
  page_assert:
    min_rows: 0
    min_total: 0
- id: ROLE-LIST-004
  title: 角色列表分页每页一条
  request:
    auth: true
    params:
      pageNum: 1
      pageSize: 1
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - rows
    - total
  page_assert:
    min_rows: 1
    min_total: 1

role_create_cases:
- id: ROLE-CREATE-001
  smoke: true
  title: 新增角色
  request:
    auth: true
    payload:
      roleName: auto_role_${unique}
      roleKey: ${unique_role_key}
      roleSort: 99
      status: '0'
      menuIds:
      - 1
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation create role
  expected:
    http_status: 200
    code: 200
    success: true
    msg_contains: 新增成功
  database:
    sql: |
      SELECT role_id, role_name, role_key, role_sort, status
      FROM sys_role
      WHERE role_key = %s AND del_flag = '0'
      LIMIT 1
    params:
    - ${unique_role_key}
    expected_fields:
      role_name: auto_role_${unique}
      role_key: ${unique_role_key}
      role_sort: 99
      status: '0'
- id: ROLE-CREATE-002
  title: 新增角色时角色名称已存在
  request:
    auth: true
    payload:
      roleName: 普通角色
      roleKey: ${unique_role_key}
      roleSort: 99
      status: '0'
      menuIds: []
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation duplicate role name
  expected:
    http_status: 200
    code: 500
    success: false
    msg_contains: 角色名称已存在
- id: ROLE-CREATE-003
  title: 新增角色时权限字符已存在
  request:
    auth: true
    payload:
      roleName: auto_role_${unique}
      roleKey: common
      roleSort: 99
      status: '0'
      menuIds: []
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation duplicate role key
  expected:
    http_status: 200
    code: 500
    success: false
    msg_contains: 角色权限已存在
- id: ROLE-CREATE-004
  title: 新增角色时角色名称为空
  request:
    auth: true
    payload:
      roleName: ''
      roleKey: ${unique_role_key}
      roleSort: 99
      status: '0'
      menuIds: []
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation empty role name
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 角色名称不能为空
- id: ROLE-CREATE-005
  title: 新增角色时权限字符为空
  request:
    auth: true
    payload:
      roleName: auto_role_${unique}
      roleKey: ''
      roleSort: 99
      status: '0'
      menuIds: []
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation empty role key
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 权限字符不能为空
- id: ROLE-CREATE-006
  title: 新增角色时显示顺序为空
  request:
    auth: true
    payload:
      roleName: auto_role_${unique}
      roleKey: ${unique_role_key}
      roleSort: null
      status: '0'
      menuIds: []
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation empty role sort
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 显示顺序不能为空
- id: ROLE-CREATE-007
  title: 新增角色时角色名称超过长度限制
  request:
    auth: true
    payload:
      roleName: api_auto_role_name_length_over_thirty_${unique}
      roleKey: ${unique_role_key}
      roleSort: 99
      status: '0'
      menuIds: []
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation long role name
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 角色名称长度不能超过30个字符

role_update_cases:
- id: ROLE-UPDATE-001
  smoke: true
  title: 编辑临时角色
  request:
    auth: true
    payload:
      roleId: ${managed_role_id}
      roleName: ${managed_role_name}_edit
      roleKey: ${managed_role_key}
      roleSort: 98
      status: '1'
      menuIds:
      - 1
      menuCheckStrictly: true
      deptCheckStrictly: true
      remark: api automation update role
  expected:
    http_status: 200
    code: 200
    success: true
    msg_contains: 更新成功
  database:
    sql: |
      SELECT role_id, role_name, role_sort, status
      FROM sys_role
      WHERE role_id = %s AND del_flag = '0'
