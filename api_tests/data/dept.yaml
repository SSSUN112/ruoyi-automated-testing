dept_exclude_cases:
- id: DEPT-EXCLUDE-001
  smoke: true
  title: 获取编辑部门下拉树
  request:
    auth: true
    dept_id: 101
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - data
  list_assert:
    rows_field: data
    min_items: 1
- id: DEPT-EXCLUDE-002
  title: 未登录获取编辑部门下拉树
  request:
    auth: false
    dept_id: 101
  expected:
    http_status: 200
    code: 401
    success: false
    msg_contains: 未登录
- id: DEPT-EXCLUDE-003
  title: 不存在部门ID获取编辑部门下拉树
  request:
    auth: true
    dept_id: 999999
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - data
  list_assert:
    rows_field: data
    min_items: 1
