user_list_cases:
- id: USER-LIST-001
  smoke: true
  title: 按用户名查询管理员
  request:
    auth: true
    params:
      pageNum: 1
      pageSize: 10
      userName: admin
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - rows
    - total
  page_assert:
    min_rows: 1
    min_total: 1
  contains_assert:
    rows_field: rows
    field: userName
    value: admin
  database:
    sql: 'SELECT user_id, user_name, nick_name, status, del_flag FROM sys_user WHERE user_name = %s AND del_flag = ''0'' LIMIT
      1

      '
    params:
    - admin
    expected_fields:
      user_name: admin
- id: USER-LIST-002
  title: 未登录获取用户列表
  request:
    auth: false
    params:
      pageNum: 1
      pageSize: 10
  expected:
    http_status: 200
    code: 401
    success: false
    msg_contains: 未登录
- id: USER-LIST-003
  title: 按不存在用户名查询用户列表
  request:
    auth: true
    params:
      pageNum: 1
      pageSize: 10
      userName: not_exists_${unique}
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - rows
    - total
  page_assert:
    min_rows: 0
    min_total: 0
- id: USER-LIST-004
  title: 用户列表分页每页一条
  request:
    auth: true
    params:
      pageNum: 1
      pageSize: 1
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - rows
    - total
  page_assert:
    min_rows: 1
    min_total: 1
user_create_cases:
- id: USER-CREATE-001
  smoke: true
  title: 新增普通用户
  request:
    auth: true
    payload:
      deptId: 105
      userName: ${unique_user}
      nickName: ${unique_nick}
      password: Api@Test123
      email: ${unique_email}
      phonenumber: ${unique_phone}
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
      remark: 接口自动化新增用户
  expected:
    http_status: 200
    code: 200
    success: true
    msg_contains: 新增成功
  database:
    sql: 'SELECT user_id, user_name, nick_name, status, del_flag FROM sys_user WHERE user_name = %s LIMIT 1

      '
    params:
    - ${unique_user}
    expected_fields:
      user_name: ${unique_user}
      nick_name: ${unique_nick}
      status: '0'
      del_flag: '0'
- id: USER-CREATE-002
  title: 新增用户时登录账号已存在
  request:
    auth: true
    payload:
      deptId: 105
      userName: admin
      nickName: 重复管理员
      password: Api@Test123
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 500
    success: false
    msg_contains: 登录账号已存在
- id: USER-CREATE-003
  title: 新增用户时登录账号为空
  request:
    auth: true
    payload:
      deptId: 105
      userName: ''
      nickName: api_auto_negative
      password: Api@Test123
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 用户账号不能为空
- id: USER-CREATE-004
  title: 新增用户时登录账号超过长度限制
  request:
    auth: true
    payload:
      deptId: 105
      userName: api_auto_user_name_over_30_chars_${unique}
      nickName: api_auto_negative
      password: Api@Test123
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 用户账号长度不能超过30个字符
- id: USER-CREATE-005
  title: 新增用户时邮箱格式错误
  request:
    auth: true
    payload:
      deptId: 105
      userName: ${unique_user}
      nickName: ${unique_nick}
      password: Api@Test123
      email: bad-email
      phonenumber: ${unique_phone}
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 邮箱格式不正确
- id: USER-CREATE-006
  title: 新增用户时手机号超过长度限制
  request:
    auth: true
    payload:
      deptId: 105
      userName: ${unique_user}
      nickName: ${unique_nick}
      password: Api@Test123
      phonenumber: '138001380001'
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 手机号码长度不能超过11个字符
user_update_cases:
- id: USER-UPDATE-001
  smoke: true
  title: 编辑临时用户昵称
  request:
    auth: true
    payload:
      userId: ${managed_user_id}
      deptId: 105
      userName: ${managed_user_name}
      nickName: ${unique_nick}_已编辑
      email: ${managed_email}
      phonenumber: ${managed_phone}
      sex: '1'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 200
    success: true
    msg_contains: 更新成功
  database:
    sql: 'SELECT user_id, user_name, nick_name, sex FROM sys_user WHERE user_id = %s LIMIT 1

      '
    params:
    - ${managed_user_id}
    expected_fields:
      nick_name: ${unique_nick}_已编辑
      sex: '1'
- id: USER-UPDATE-002
  title: 不允许编辑超级管理员
