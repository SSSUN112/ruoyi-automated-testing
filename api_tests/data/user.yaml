    http_status: 200
    code: 500
    success: false
    msg_contains: 不允许操作超级管理员用户
- id: USER-UPDATE-003
  title: 编辑不存在的用户
  request:
    auth: true
    payload:
      userId: 999999
      deptId: 105
      userName: api_auto_not_exists
      nickName: api_auto_negative
      email: not_exists@example.com
      phonenumber: '13800138000'
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 500
    success: false
    msg_contains: NoneType
- id: USER-UPDATE-004
  title: 编辑用户时邮箱格式错误
  request:
    auth: true
    payload:
      userId: ${managed_user_id}
      deptId: 105
      userName: ${managed_user_name}
      nickName: ${managed_nick}
      email: bad-email
      phonenumber: ${managed_phone}
      sex: '2'
      status: '0'
      roleIds:
      - 2
      postIds:
      - 4
      role: []
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 邮箱格式不正确
