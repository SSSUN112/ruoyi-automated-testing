user_avatar_cases:
- id: USER-AVATAR-001
  smoke: true
  title: 上传当前用户头像-图片1
  request:
    auth: true
    file:
      field_name: avatarfile
      path: api_tests/data/files/1.jpg
      filename: 1.jpg
      content_type: image/jpeg
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - imgUrl
- id: USER-AVATAR-002
  title: 上传当前用户头像-图片2
  request:
    auth: true
    file:
      field_name: avatarfile
      path: api_tests/data/files/2.jpg
      filename: 2.jpg
      content_type: image/jpeg
  expected:
    http_status: 200
    code: 200
    success: true
    required_fields:
    - imgUrl
- id: USER-AVATAR-003
  title: 未登录上传头像
  request:
    auth: false
    file:
      field_name: avatarfile
      path: api_tests/data/files/1.jpg
      filename: 1.jpg
      content_type: image/jpeg
  expected:
    http_status: 200
    code: 401
    success: false
    msg_contains: 未登录
- id: USER-AVATAR-004
  title: 上传当前用户头像-空文件
  request:
    auth: true
    file:
      field_name: avatarfile
      base64: ''
      filename: empty.png
      content_type: image/png
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 上传图片异常
- id: USER-AVATAR-005
  title: 上传当前用户头像-非图片文件
  request:
    auth: true
    file:
      field_name: avatarfile
      text: not image content
      filename: avatar.txt
      content_type: text/plain
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 头像文件类型不合法
- id: USER-AVATAR-006
  title: 上传当前用户头像-超大文件
  request:
    auth: true
    file:
      field_name: avatarfile
      size_bytes: 2097153
      fill_byte: 0
      filename: large.png
      content_type: image/png
  expected:
    http_status: 200
    code: 601
    success: false
    msg_contains: 头像文件大小不能超过2MB
